AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Customer Feedback Sentiment Analysis System - Simple SAM Template'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name
  
  S3BucketName:
    Type: String
    Default: customer-feedback-sentiment-analysis
    Description: S3 bucket name for storing customer feedback files
  
  NotificationEmail:
    Type: String
    Default: admin@example.com
    Description: Email address for notifications

Globals:
  Function:
    Timeout: 300
    Runtime: python3.12
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref SentimentAnalysisTable
        DYNAMODB_ALERTS_TABLE: !Ref AlertsTable
        S3_BUCKET: !Ref CustomerFeedbackBucket
        SNS_TOPIC_ARN: !Ref NotificationTopic
        NEGATIVE_SENTIMENT_THRESHOLD: 0.3

Resources:
  # S3 Bucket for customer feedback files
  CustomerFeedbackBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${S3BucketName}-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # DynamoDB table for sentiment analysis results
  SentimentAnalysisTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sentiment-analysis-results-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: object_key
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ObjectKeyIndex
          KeySchema:
            - AttributeName: object_key
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # DynamoDB table for alerts
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "sentiment-alerts-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: alert_type
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: AlertTypeIndex
          KeySchema:
            - AttributeName: alert_type
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # SNS Topic for notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "sentiment-analysis-notifications-${Environment}"
      DisplayName: Sentiment Analysis Notifications

  # SNS Subscription
  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      TopicArn: !Ref NotificationTopic
      Endpoint: !Ref NotificationEmail

  # Lambda function for sentiment processing
  SentimentProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sentiment-processor-${Environment}"
      CodeUri: ../../lambda/sentiment-processor/
      Handler: lambda_function.lambda_handler
      Description: Process customer feedback files and perform sentiment analysis
      MemorySize: 512
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref CustomerFeedbackBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref SentimentAnalysisTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - ComprehendReadOnlyPolicy
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationTopic.TopicName
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Ref CustomerFeedbackBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .csv
                  - Name: suffix
                    Value: .json
                  - Name: suffix
                    Value: .txt

  # Lambda function for API handling
  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "sentiment-api-handler-${Environment}"
      CodeUri: ../../lambda/api-handler/
      Handler: lambda_function.lambda_handler
      Description: Handle API requests for sentiment analysis system
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SentimentAnalysisTable
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
        - S3ReadPolicy:
            BucketName: !Ref CustomerFeedbackBucket
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  CustomerFeedbackBucketName:
    Description: S3 bucket name for customer feedback files
    Value: !Ref CustomerFeedbackBucket
    Export:
      Name: !Sub "${AWS::StackName}-CustomerFeedbackBucket"

  SentimentAnalysisTableName:
    Description: DynamoDB table name for sentiment analysis results
    Value: !Ref SentimentAnalysisTable
    Export:
      Name: !Sub "${AWS::StackName}-SentimentAnalysisTable"

  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"

  NotificationTopicArn:
    Description: SNS topic ARN for notifications
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub "${AWS::StackName}-NotificationTopic"
