Outputs:
  CustomerFeedbackBucketName:
    Description: S3 bucket name for customer feedback files
    Value: !Ref CustomerFeedbackBucket
    Export:
      Name: !Sub "${AWS::StackName}-CustomerFeedbackBucket"

  SentimentAnalysisTableName:
    Description: DynamoDB table name for sentiment analysis results
    Value: !Ref SentimentAnalysisTable
    Export:
      Name: !Sub "${AWS::StackName}-SentimentAnalysisTable"

  AlertsTableName:
    Description: DynamoDB table name for alerts
    Value: !Ref AlertsTable
    Export:
      Name: !Sub "${AWS::StackName}-AlertsTable"

  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${SentimentAnalysisApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"

  NotificationTopicArn:
    Description: SNS topic ARN for notifications
    Value: !Ref NotificationTopic
    Export:
      Name: !Sub "${AWS::StackName}-NotificationTopic"

  SentimentProcessorFunctionName:
    Description: Lambda function name for sentiment processing
    Value: !Ref SentimentProcessorFunction
    Export:
      Name: !Sub "${AWS::StackName}-SentimentProcessorFunction"

  ApiHandlerFunctionName:
    Description: Lambda function name for API handling
    Value: !Ref ApiHandlerFunction
    Export:
      Name: !Sub "${AWS::StackName}-ApiHandlerFunction"

  AlertHandlerFunctionName:
    Description: Lambda function name for alert handling
    Value: !Ref AlertHandlerFunction
    Export:
      Name: !Sub "${AWS::StackName}-AlertHandlerFunction"
